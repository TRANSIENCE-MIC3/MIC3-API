services:
  kafka:
    image: &kafka-image apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      # This local cluster identity is not a credential. Preserve it with the volume.
      CLUSTER_ID: MkMza2Fma2Fsb2NhbDAwMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - mic3-kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:19092, --list]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: *kafka-image
    profiles: [tools]
    entrypoint: [/bin/bash, /scripts/init-topics.sh]
    volumes:
      - ./deploy/local/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  postgres:
    image: quay.io/sclorg/postgresql-18-c9s@sha256:e8d01a0c455cb4a77944b0e34e8d7c5ccc6c76276025840b019ae0383573efd5
    environment:
      POSTGRESQL_DATABASE: ${DB_NAME:-mic3}
      POSTGRESQL_USER: ${DB_USER:-mic3_api}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRESQL_LOG_DESTINATION: /dev/stderr
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - mic3-postgres-data:/var/lib/pgsql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRESQL_USER}" -d "$${POSTGRESQL_DATABASE}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  keycloak-postgres:
    image: quay.io/sclorg/postgresql-18-c9s@sha256:e8d01a0c455cb4a77944b0e34e8d7c5ccc6c76276025840b019ae0383573efd5
    environment:
      POSTGRESQL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRESQL_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRESQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env}
      POSTGRESQL_LOG_DESTINATION: /dev/stderr
    volumes:
      - keycloak-postgres-data:/var/lib/pgsql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRESQL_USER}" -d "$${POSTGRESQL_DATABASE}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command:
      - start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KCRAW_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    stop_grace_period: 30s

  keycloak-config:
    image: quay.io/adorsys/keycloak-config-cli:6.5.1-26@sha256:1b22dfaa9ae0c71f74b0342f9221a6510f272da5def683dbba26a98e6b1b1411
    profiles:
      - tools
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      KEYCLOAK_LOGINREALM: master
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: file:/config/*
      IMPORT_VALIDATE: "true"
      IMPORT_REMOTESTATE_ENABLED: "true"
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_BEHAVIORS_CHECKSUM_CHANGED: continue
      LOGGING_LEVEL_ROOT: INFO
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./deploy/local/keycloak/config:/config:ro
    mem_limit: 768m

volumes:
  mic3-kafka-data:
  mic3-postgres-data:
  keycloak-postgres-data:
