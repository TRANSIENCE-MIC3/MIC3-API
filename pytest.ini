[pytest]
# Environment checks are slow and test local infrastructure, not the app.
# Run everything with: pytest -m ""
addopts = --import-mode=importlib -m "not environment"
markers =
    smoke: tests that make requests to a running deployment
    environment: checks of local Kafka/Keycloak setup; excluded by default, run in CI
    live_notifications: keep the real Postgres notification listener in created apps
