# Standalone AIStor; credentials and license are provisioned separately.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mic3-aistor-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mic3-aistor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mic3-aistor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mic3-aistor
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aistor
          image: quay.io/minio/aistor/minio@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
          command: ["minio"]
          args:
            - server
            - /data
            - --license
            - /license/minio.license
            - --console-address
            - ":9001"
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mic3-aistor-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mic3-aistor-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: license
              mountPath: /license
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mic3-aistor-data
        - name: license
          secret:
            secretName: mic3-aistor-credentials
            items:
              - key: minio.license
                path: minio.license
---
apiVersion: v1
kind: Service
metadata:
  name: mic3-aistor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mic3-aistor
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
