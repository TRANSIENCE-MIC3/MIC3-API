apiVersion: apps/v1
kind: Deployment
metadata:
  name: mic3-api
  labels:
    app.kubernetes.io/name: mic3-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mic3-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mic3-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/transience-mic3/mic3-api:0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: development
            - name: DB_HOST
              value: mic3-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mic3-postgres-credentials
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mic3-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mic3-postgres-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mic3-api
  labels:
    app.kubernetes.io/name: mic3-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mic3-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mic3-api
  labels:
    app.kubernetes.io/name: mic3-api
spec:
  to:
    kind: Service
    name: mic3-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
