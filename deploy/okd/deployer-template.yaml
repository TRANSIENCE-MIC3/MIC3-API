apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: mic3-deployment-bootstrap
parameters:
  - name: NAMESPACE
    required: true
objects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: mic3-github-deployer
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: mic3-api-runtime
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: mic3-api-migration
    automountServiceAccountToken: false
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: mic3-github-deployer
    rules:
      - apiGroups: [apps]
        resources: [deployments]
        resourceNames: [mic3-api, mic3-publisher, mic3-worker]
        verbs: [get, list, watch, patch, update]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [get, list, watch]
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [get, list, watch, create, patch, delete]
      - apiGroups: ['']
        resources: [pods]
        verbs: [get, list, watch]
      - apiGroups: ['']
        resources: [pods/log]
        verbs: [get]
      - apiGroups: ['']
        resources: [events]
        verbs: [get, list]
      # Helm's release records require namespace-wide Secret operations.
      # RBAC cannot restrict create/list by a release-name prefix or label.
      - apiGroups: ['']
        resources: [secrets]
        verbs: [get, list, create, update, delete]
      - apiGroups: ['']
        resources: [serviceaccounts]
        resourceNames: [mic3-publisher, mic3-worker]
        verbs: [get, patch, update]
      - apiGroups: ['']
        resources: [configmaps]
        resourceNames: [mic3-model-values]
        verbs: [get, patch, update]
      - apiGroups: [networking.k8s.io]
        resources: [networkpolicies]
        resourceNames: [mic3-publisher, mic3-worker]
        verbs: [get, patch, update]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [roles, rolebindings]
        resourceNames: [mic3-worker]
        verbs: [get, patch, update]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: mic3-github-deployer
    subjects:
      - kind: ServiceAccount
        name: mic3-github-deployer
        namespace: ${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: mic3-github-deployer
