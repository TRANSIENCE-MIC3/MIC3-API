apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: mic3-certificates-staging
parameters:
  - name: ACME_EMAIL
    description: Contact email for the Let's Encrypt staging account.
    required: true
  - name: API_HOST
    description: Public API DNS hostname, without scheme or path.
    required: true
  - name: AUTH_HOST
    description: Public authentication DNS hostname, without scheme or path.
    required: true
objects:
  - apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: mic3-letsencrypt-staging
    spec:
      acme:
        email: ${ACME_EMAIL}
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: mic3-letsencrypt-staging-account
        solvers:
          - http01:
              ingress:
                # Exercise EOSC's default Ingress handling before selecting a class.
                serviceType: ClusterIP
                podTemplate:
                  spec:
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: mic3-api-staging
    spec:
      secretName: mic3-api-staging-tls
      dnsNames:
        - ${API_HOST}
      privateKey:
        algorithm: RSA
        size: 2048
        rotationPolicy: Always
      issuerRef:
        name: mic3-letsencrypt-staging
        kind: Issuer
        group: cert-manager.io
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: mic3-auth-staging
    spec:
      secretName: mic3-auth-staging-tls
      dnsNames:
        - ${AUTH_HOST}
      privateKey:
        algorithm: RSA
        size: 2048
        rotationPolicy: Always
      issuerRef:
        name: mic3-letsencrypt-staging
        kind: Issuer
        group: cert-manager.io
