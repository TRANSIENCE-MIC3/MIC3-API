apiVersion: batch/v1
kind: Job
metadata:
  generateName: mic3-keycloak-configure-
  labels:
    app.kubernetes.io/name: mic3-keycloak-config
    app.kubernetes.io/component: realm-configuration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mic3-keycloak-config
        app.kubernetes.io/component: realm-configuration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: quay.io/adorsys/keycloak-config-cli:6.5.1-26@sha256:1b22dfaa9ae0c71f74b0342f9221a6510f272da5def683dbba26a98e6b1b1411
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_URL
              value: http://mic3-keycloak:8080
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: mic3-keycloak-bootstrap-admin
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mic3-keycloak-bootstrap-admin
                  key: password
            - name: KEYCLOAK_LOGINREALM
              value: master
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 120s
            - name: IMPORT_FILES_LOCATIONS
              value: file:/config/*
            - name: IMPORT_VALIDATE
              value: "true"
            - name: IMPORT_REMOTESTATE_ENABLED
              value: "true"
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: IMPORT_BEHAVIORS_CHECKSUM_CHANGED
              value: continue
            - name: LOGGING_LEVEL_ROOT
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: realm-config
              mountPath: /config
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: realm-config
          configMap:
            name: mic3-keycloak-realm
        - name: temporary-files
          emptyDir: {}
