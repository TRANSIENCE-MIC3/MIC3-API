{{- range $role := list "publisher" "worker" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mic3-{{ $role }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mic3-{{ $role }}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-dns}
      ports:
        {{- range $.Values.networkPolicy.dnsPorts }}
        - {protocol: UDP, port: {{ . }}}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    - to: {{ toYaml $.Values.networkPolicy.databasePeers | nindent 8 }}
      ports: [{protocol: TCP, port: {{ $.Values.database.port }}}]
    - to: {{ toYaml $.Values.networkPolicy.kafkaPeers | nindent 8 }}
      ports: [{protocol: TCP, port: 9092}]
    {{- if eq $role "worker" }}
    - to: {{ toYaml $.Values.networkPolicy.storagePeers | nindent 8 }}
      ports: [{protocol: TCP, port: {{ $.Values.networkPolicy.storagePort }}}]
    {{- with $.Values.networkPolicy.apiPeers }}
    - to: {{ toYaml . | nindent 8 }}
      ports:
        {{- range $.Values.networkPolicy.apiPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
