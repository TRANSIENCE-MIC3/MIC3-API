apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mic3-worker
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mic3-worker
subjects:
  - kind: ServiceAccount
    name: mic3-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mic3-worker
