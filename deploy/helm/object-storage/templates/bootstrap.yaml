apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-bootstrap
data:
  bootstrap.sh: |
    {{- .Files.Get "files/bootstrap.sh" | nindent 4 }}
  upload-policy.json: |
    {{- tpl (.Files.Get "files/upload-policy.json") . | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: configure
          image: {{ .Values.clientImage | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /bootstrap/bootstrap.sh]
          env:
            - {name: HOME, value: /tmp}
            - {name: MC_CONFIG_DIR, value: /tmp/mc}
            - name: S3_ENDPOINT
              value: {{ printf "http://%s:9000" .Values.name | quote }}
            - name: S3_BUCKET
              value: {{ .Values.bucket | quote }}
            - name: POLICY_NAME
              value: {{ .Values.policyName | quote }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.serverSecret }}, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.serverSecret }}, key: MINIO_ROOT_PASSWORD}
            - name: TRANSFER_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.transferSecret }}, key: AWS_ACCESS_KEY_ID}
            - name: TRANSFER_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.transferSecret }}, key: AWS_SECRET_ACCESS_KEY}
          resources:
            {{- toYaml .Values.bootstrapResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: bootstrap
          configMap:
            name: {{ .Values.name }}-bootstrap
        - name: temporary
          emptyDir: {sizeLimit: 64Mi}
