process.roles=broker,controller
node.id=1
controller.quorum.voters=1@{{ include "kafka.controller" . }}:9093
controller.listener.names=CONTROLLER
inter.broker.listener.name=CLIENT
listeners=CLIENT://:9092,CONTROLLER://:9093
advertised.listeners=CLIENT://{{ include "kafka.address" . }}:9092
listener.security.protocol.map=CLIENT:SSL,CONTROLLER:SSL
ssl.client.auth=required
ssl.endpoint.identification.algorithm=https
ssl.enabled.protocols=TLSv1.2,TLSv1.3
ssl.keystore.type=PEM
ssl.keystore.location=/tmp/kafka/identity.pem
ssl.truststore.type=PEM
ssl.truststore.location=/var/run/mic3/kafka-trust/ca.crt
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:CN={{ .Values.name }}-broker;User:CN={{ .Values.name }}-operator
log.dirs=/var/lib/kafka/data/logs
auto.create.topics.enable=false
num.partitions=1
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
offsets.topic.num.partitions=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
transaction.state.log.num.partitions=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
share.coordinator.state.topic.num.partitions=1
log.retention.ms={{ .Values.topics.retentionMs | int64 }}
log.retention.bytes={{ .Values.topics.retentionBytes | int64 }}
log.segment.bytes={{ .Values.topics.segmentBytes | int64 }}
group.initial.rebalance.delay.ms=0
