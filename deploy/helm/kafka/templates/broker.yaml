{{- if .Values.broker.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests: {storage: {{ .Values.persistence.size }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ .Values.name }}}
  ports: [{name: client, port: 9092, targetPort: client}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: {{ .Values.name }}}
  ports: [{name: controller, port: 9093, targetPort: controller}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
spec:
  serviceName: {{ .Values.name }}-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Values.name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        mic3.io/kafka-cluster: {{ .Values.name }}
      annotations:
        checksum/configuration: {{ include (print $.Template.BasePath "/configuration.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        {{- include "kafka.securityContext" . | nindent 8 }}
      containers:
        - name: kafka
          image: {{ .Values.image | quote }}
          command: [/bin/bash, /etc/mic3/kafka/start.sh]
          env:
            - {name: CLUSTER_ID, value: {{ .Values.broker.clusterId | quote }}}
            - {name: KAFKA_HEAP_OPTS, value: {{ .Values.broker.heapOpts | quote }}}
            - {name: LOG_DIR, value: /tmp/kafka}
            - {name: HOME, value: /tmp}
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            tcpSocket: {port: client}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: client}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: client}
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: configuration, mountPath: /etc/mic3/kafka, readOnly: true}
            - {name: identity, mountPath: /var/run/mic3/kafka, readOnly: true}
            - {name: trust, mountPath: /var/run/mic3/kafka-trust, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Values.name }}-data}
        - name: configuration
          configMap: {name: {{ .Values.name }}-configuration}
        - name: identity
          secret:
            secretName: {{ .Values.name }}-broker-tls
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
        - name: trust
          configMap: {name: {{ .Values.trustConfigMap }}}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
{{- end }}
