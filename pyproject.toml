[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mic3-api"
version = "0.1.9"
description = "mic3-api HTTP service for the modeling platform"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
messaging = ["confluent-kafka==2.16.0"]
execution = ["kubernetes==35.0.0", "boto3==1.43.117", "PyYAML>=6,<7"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
