apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: eu-mfa-buildings-test
parameters:
- name: TEST_NAME
  description: Unique DNS-compatible Job name; also identifies its output directory.
  required: true
- name: PVC_NAME
  description: Model-wide shared outputs claim, independent of the Job name.
  required: true
- name: IMAGE_REF
  description: Published image reference including its sha256 digest.
  required: true
- name: STORAGE_CLASS
  value: shared
  required: true
- name: STORAGE_SIZE
  required: true
- name: CPU_REQUEST
  required: true
- name: CPU_LIMIT
  required: true
- name: MEMORY_REQUEST
  required: true
- name: MEMORY_LIMIT
  required: true
- name: PULL_SECRET
  value: ghcr-pull
objects:
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: ${PVC_NAME}
    labels:
      app.kubernetes.io/name: eu-mfa
      app.kubernetes.io/component: model-artifacts
  spec:
    accessModes:
    - ReadWriteMany
    storageClassName: ${STORAGE_CLASS}
    resources:
      requests:
        storage: ${STORAGE_SIZE}
- apiVersion: batch/v1
  kind: Job
  metadata:
    name: ${TEST_NAME}
    labels:
      app.kubernetes.io/name: eu-mfa
      app.kubernetes.io/instance: ${TEST_NAME}
  spec:
    backoffLimit: 0
    activeDeadlineSeconds: 600
    template:
      metadata:
        labels:
          app.kubernetes.io/name: eu-mfa
          app.kubernetes.io/instance: ${TEST_NAME}
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        imagePullSecrets:
        - name: ${PULL_SECRET}
        nodeSelector:
          kubernetes.io/os: linux
          kubernetes.io/arch: amd64
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        initContainers:
        - name: prepare-output-directory
          image: ${IMAGE_REF}
          command:
          - python
          - -c
          - |
            import os
            import re
            from pathlib import Path
            run_name = os.environ["RUN_NAME"]
            if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", run_name):
                raise ValueError("RUN_NAME must contain lowercase DNS-label characters")
            root = Path("/outputs").resolve()
            directory = root / "buildings" / run_name / "attempt-001"
            if not directory.resolve().is_relative_to(root):
                raise ValueError("Output directory escapes the mounted volume")
            directory.mkdir(parents=True, exist_ok=False)
          env:
          - name: RUN_NAME
            value: ${TEST_NAME}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
          - name: outputs
            mountPath: /outputs
        containers:
        - name: buildings
          image: ${IMAGE_REF}
          imagePullPolicy: IfNotPresent
          workingDir: /opt/eu-mfa
          command: [python, eumfa_buildings.py]
          resources:
            requests:
              cpu: ${CPU_REQUEST}
              memory: ${MEMORY_REQUEST}
            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
          - name: outputs
            mountPath: /opt/eu-mfa/data/baseline_buildings/output
            subPath: buildings/${TEST_NAME}/attempt-001
        volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: ${PVC_NAME}
