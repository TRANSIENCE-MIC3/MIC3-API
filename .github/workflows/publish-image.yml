name: Publish and deploy services

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Application tag to publish if needed, then deploy (for example v0.1.5)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE_PREFIX: ghcr.io/transience-mic3/mic3
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-${{ github.repository }}-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      publisher_image_ref: ${{ steps.image.outputs.publisher_image_ref }}
      worker_image_ref: ${{ steps.image.outputs.worker_image_ref }}
      execution_available: ${{ steps.image.outputs.execution_available }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate stable release tag
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      # Release tooling follows the workflow, including retries of legacy tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check package version and source commit
        id: source
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$RELEASE_TAG" == "v$version" ]]
          commit=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing release or prepare to publish
        id: record
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: python .workflow-tools/scripts/release_record.py discover --record "$RUNNER_TEMP/release.json"
      - name: Refuse to overwrite any existing version image
        if: steps.record.outputs.build_required == 'true'
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: python .workflow-tools/scripts/release_record.py preflight --record "$RUNNER_TEMP/release.json"
      - name: Install verified Helm for chart tests
        if: steps.record.outputs.build_required == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/helm-client"
          cd "$RUNNER_TEMP/helm-client"
          curl --fail --silent --show-error --location --max-time 120 \
            https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o helm.tar.gz
          echo '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tar.gz' | sha256sum --check -
          tar -xzf helm.tar.gz linux-amd64/helm
          echo "$RUNNER_TEMP/helm-client/linux-amd64" >> "$GITHUB_PATH"
      - name: Install test dependencies
        if: steps.record.outputs.build_required == 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run unit and integration tests
        if: steps.record.outputs.build_required == 'true'
        run: |
          command -v helm
          helm version --short
          python -m pytest tests/unit tests/integration --durations=8
      - name: Set up Docker Buildx
        if: steps.record.outputs.build_required == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build all three local images
        if: steps.record.outputs.build_required == 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          for role in api publisher worker; do
            docker buildx build --platform linux/amd64 --target "$role" --load --provenance=false \
              --tag "$IMAGE_PREFIX-$role:$VERSION" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$COMMIT" \
              --label "org.opencontainers.image.version=$VERSION" .
          done
      - name: Validate packaged runtimes and secured Kafka
        if: steps.record.outputs.build_required == 'true'
        env:
          MIC3_RUNTIME_PACKAGING_SMOKE: "1"
          MIC3_KAFKA_PACKAGING_SMOKE: "1"
          MIC3_API_IMAGE: ${{ env.IMAGE_PREFIX }}-api:${{ steps.source.outputs.version }}
          MIC3_PUBLISHER_IMAGE: ${{ env.IMAGE_PREFIX }}-publisher:${{ steps.source.outputs.version }}
          MIC3_WORKER_IMAGE: ${{ env.IMAGE_PREFIX }}-worker:${{ steps.source.outputs.version }}
          MIC3_KAFKA_CLIENT_IMAGE: ${{ env.IMAGE_PREFIX }}-worker:${{ steps.source.outputs.version }}
        run: python -m pytest tests/smoke/test_runtime_packaging.py tests/smoke/test_kafka_packaging.py -q
      - name: Publish tested images and verify immutable references
        if: steps.record.outputs.build_required == 'true'
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: python .workflow-tools/scripts/release_record.py publish --record "$RUNNER_TEMP/release.json"
      - name: Save immutable release record
        if: steps.record.outputs.build_required == 'true'
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release.json" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --notes 'API, publisher and worker images published. See Actions for deployment and execution verification results.'
      - name: Validate release record and export deployment images
        id: image
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: python .workflow-tools/scripts/release_record.py validate --record "$RUNNER_TEMP/release.json"

  deploy:
    name: Deploy to EOSC
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: eosc-development
    concurrency:
      group: eosc-development
      cancel-in-progress: false
    env:
      IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
      PUBLISHER_IMAGE_REF: ${{ needs.prepare.outputs.publisher_image_ref }}
      WORKER_IMAGE_REF: ${{ needs.prepare.outputs.worker_image_ref }}
      EXECUTION_AVAILABLE: ${{ needs.prepare.outputs.execution_available }}
      EXECUTION_API_CIDRS: ${{ vars.EXECUTION_API_CIDRS }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
      OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      OIDC_ISSUER_URL: ${{ vars.OIDC_ISSUER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use deployment instructions from this workflow, independently of the application tag.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install verified Helm and delivery dependencies
        if: env.EXECUTION_AVAILABLE == 'true'
        run: |
          python -m pip install PyYAML==6.0.3
          mkdir -p "$RUNNER_TEMP/helm-client"
          cd "$RUNNER_TEMP/helm-client"
          curl --fail --silent --show-error --location --max-time 120 \
            https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o helm.tar.gz
          echo '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tar.gz' | sha256sum --check -
          tar -xzf helm.tar.gz linux-amd64/helm
          echo "$RUNNER_TEMP/helm-client/linux-amd64" >> "$GITHUB_PATH"
      - name: Install OpenShift client
        run: |
          mkdir -p "$RUNNER_TEMP/oc-client"
          cd "$RUNNER_TEMP/oc-client"
          curl --fail --silent --show-error --location --max-time 120 \
            https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.21.0/openshift-client-linux.tar.gz -o oc.tar.gz
          echo '735b43f9ae4ffe8f1777b13e23d691540f51dcbe18ac73ab058754d42abfb4b2  oc.tar.gz' | sha256sum --check -
          tar -xzf oc.tar.gz oc
          echo "$RUNNER_TEMP/oc-client" >> "$GITHUB_PATH"
      - name: Configure cluster access
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_CA_PEM: ${{ secrets.OPENSHIFT_CA_PEM }}
        run: |
          : "${OPENSHIFT_TOKEN:?Set the environment secret}" "${OPENSHIFT_NAMESPACE:?Set the environment variable}"
          for url in "$OPENSHIFT_SERVER" "$API_BASE_URL" "$OIDC_ISSUER_URL"; do
            [[ "$url" == https://* ]] || { echo 'Configure HTTPS server and public endpoint URLs.' >&2; exit 1; }
          done
          export KUBECONFIG="$RUNNER_TEMP/eosc-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          umask 077
          oc config set-cluster eosc --server="$OPENSHIFT_SERVER"
          oc config set-credentials deployer --token="$OPENSHIFT_TOKEN"
          oc config set-context eosc --cluster=eosc --user=deployer --namespace="$OPENSHIFT_NAMESPACE"
          oc config use-context eosc
          if [[ -n "$OPENSHIFT_CA_PEM" ]]; then
            printf '%s' "$OPENSHIFT_CA_PEM" > "$RUNNER_TEMP/eosc-ca.pem"
            oc config set-cluster eosc --certificate-authority="$RUNNER_TEMP/eosc-ca.pem" --embed-certs=true
          fi
      - name: Reject older releases
        run: |
          current=$(oc --request-timeout=20s get deployment mic3-api -o jsonpath='{.metadata.annotations.delivery\.mic3\.io/version}')
          : "${current:?Live release version is missing; inspect the Deployment before retrying}"
          [[ "$(printf '%s\n' "$current" "$VERSION" | sort -V | head -n1)" == "$current" ]] || { echo 'Older versions require manual recovery.' >&2; exit 1; }
          if [[ "$current" == "$VERSION" ]]; then
            live_image=$(oc --request-timeout=20s get deployment mic3-api -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')
            [[ "$live_image" == "$IMAGE_REF" ]] || { echo 'This version already uses a different image; inspect before retrying.' >&2; exit 1; }
          fi
      - name: Render and server-validate both manifests
        run: |
          for resource in application migration; do
            oc process --local -f "deploy/okd/$resource-template.yaml" \
              -p "IMAGE_REF=$IMAGE_REF" -p "RELEASE_VERSION=$VERSION" -p "SOURCE_COMMIT=$COMMIT" \
              -o json | jq '.items[0]' > "$RUNNER_TEMP/$resource.json"
          done
          oc --request-timeout=20s apply --dry-run=server -f "$RUNNER_TEMP/application.json"
          oc --request-timeout=20s create --dry-run=server -f "$RUNNER_TEMP/migration.json"
      - name: Render and preflight execution delivery
        if: env.EXECUTION_AVAILABLE == 'true'
        run: |
          python scripts/execution_delivery.py render --directory "$RUNNER_TEMP"
          python scripts/execution_delivery.py preflight --directory "$RUNNER_TEMP"
      - name: Run database migration
        id: migrate
        run: |
          # Terminal Jobs return immediately; unfinished Jobs share an eleven-minute wait.
          wait_job() {
            local job=$1 conditions
            while (( SECONDS < deadline )); do
              conditions=$(oc --request-timeout=20s get "$job" -o jsonpath='{.status.conditions[?(@.status=="True")].type}') || return 1
              case "$conditions" in
                *Failed*) echo Failed; return 0 ;;
                *Complete*) echo Complete; return 0 ;;
              esac
              sleep 5
            done
            echo "$job did not finish; inspect it before retrying." >&2
            return 1
          }
          oc --request-timeout=20s get jobs -l app.kubernetes.io/name=mic3-api,app.kubernetes.io/component=database-migration -o name > "$RUNNER_TEMP/migration-jobs"
          deadline=$((SECONDS + 660))
          while IFS= read -r previous; do
            echo "job=${previous#*/}" >> "$GITHUB_OUTPUT"
            wait_job "$previous"
          done < "$RUNNER_TEMP/migration-jobs"
          job=$(oc --request-timeout=20s create -f "$RUNNER_TEMP/migration.json" -o jsonpath='{.metadata.name}')
          echo "job=$job" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + 660))
          state=$(wait_job "job/$job")
          [[ "$state" == Complete ]] || { echo "Migration $job failed." >&2; exit 1; }
      - name: Upgrade execution services and verify rollout
        id: execution
        if: env.EXECUTION_AVAILABLE == 'true'
        run: |
          helm upgrade mic3-execution deploy/helm/execution-services \
            --namespace "$OPENSHIFT_NAMESPACE" --reset-values \
            -f deploy/okd/execution.values.yaml -f "$RUNNER_TEMP/execution-overrides.json" \
            --wait=legacy --timeout 5m --history-max 10
          python scripts/execution_delivery.py verify --directory "$RUNNER_TEMP"
      - name: Apply API and wait for rollout
        id: rollout
        run: |
          oc --request-timeout=20s apply -f "$RUNNER_TEMP/application.json"
          oc rollout status deployment/mic3-api --timeout=300s
          oc --request-timeout=20s get deployment mic3-api -o json |
            jq -e --arg image "$IMAGE_REF" '.spec.template.spec.containers[] | select(.name == "api") | .image == $image'
      - name: Verify public endpoints
        id: smoke
        run: |
          api=${API_BASE_URL%/}
          issuer=${OIDC_ISSUER_URL%/}
          curl --fail --silent --show-error --max-time 15 --retry 2 "$api/health" | jq -e '.status == "healthy"'
          curl --fail --silent --show-error --max-time 15 --retry 2 "$api/ready" | jq -e '.status == "ready"'
          [[ "$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$api/users/me")" == 401 ]]
          curl --fail --silent --show-error --max-time 15 --retry 2 "$issuer/.well-known/openid-configuration" > "$RUNNER_TEMP/discovery.json"
          jq -e --arg issuer "$issuer" '.issuer == $issuer and (.jwks_uri | startswith("https://"))' "$RUNNER_TEMP/discovery.json"
          curl --fail --silent --show-error --max-time 15 --retry 2 "$(jq -r .jwks_uri "$RUNNER_TEMP/discovery.json")" | jq -e '.keys | length > 0'
      - name: Verify end-to-end execution
        id: verification
        if: env.EXECUTION_AVAILABLE == 'true'
        run: |
          job=$(oc --request-timeout=20s create -f "$RUNNER_TEMP/verification.json" -o jsonpath='{.metadata.name}')
          echo "job=$job" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + 1020))
          while (( SECONDS < deadline )); do
            state=$(oc --request-timeout=20s get "job/$job" -o jsonpath='{.status.conditions[?(@.status=="True")].type}')
            case "$state" in
              *Failed*) echo 'Execution verification failed; inspect retained run.' >&2; exit 1 ;;
              *Complete*) exit 0 ;;
            esac
            sleep 5
          done
          echo 'Verification Job timed out; inspect retained run.' >&2
          exit 1
      - name: Collect execution diagnostics
        if: always() && env.EXECUTION_AVAILABLE == 'true'
        env:
          VERIFICATION_JOB: ${{ steps.verification.outputs.job }}
        run: |
          [[ -f "$RUNNER_TEMP/eosc-kubeconfig" ]] || exit 0
          for role in api publisher worker; do
            oc --request-timeout=20s get "deployment/mic3-$role" \
              -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[*].image,READY:.status.readyReplicas' || true
            oc --request-timeout=20s logs "deployment/mic3-$role" --all-containers=true --tail=100 || true
          done
          helm status mic3-execution -o json | jq '{name,version,status:.info.status}' || true
          oc --request-timeout=20s get events --sort-by=.metadata.creationTimestamp | tail -n 40 || true
          if [[ -n "$VERIFICATION_JOB" ]]; then
            oc --request-timeout=20s logs "job/$VERIFICATION_JOB" --tail=100 > "$RUNNER_TEMP/verification.log" || true
            cat "$RUNNER_TEMP/verification.log"
            run_id=$(jq -Rr 'fromjson? | .run_id // empty' "$RUNNER_TEMP/verification.log" | head -n 1)
            echo "Diagnostic run: ${run_id:-unavailable}; Job: $VERIFICATION_JOB" >> "$GITHUB_STEP_SUMMARY"
            oc --request-timeout=20s get "job/$VERIFICATION_JOB" -o json | jq '{name:.metadata.name,status}' || true
            # Retain indefinitely if log retrieval failed; otherwise allow diagnostics a day.
            if [[ -s "$RUNNER_TEMP/verification.log" ]]; then
              oc --request-timeout=20s patch "job/$VERIFICATION_JOB" --type=merge -p '{"spec":{"ttlSecondsAfterFinished":86400}}' || true
            fi
          fi
      - name: Collect migration logs
        if: always() && steps.migrate.outputs.job != ''
        env:
          MIGRATION_JOB: ${{ steps.migrate.outputs.job }}
        run: |
          oc --request-timeout=20s logs "job/$MIGRATION_JOB" --all-containers=true --tail=200 || true
          oc --request-timeout=20s describe job "$MIGRATION_JOB"
      - name: Record outcome and remove local credentials
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          MIGRATION_JOB: ${{ steps.migrate.outputs.job }}
          MIGRATION_RESULT: ${{ steps.migrate.outcome }}
          ROLLOUT_RESULT: ${{ steps.rollout.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          EXECUTION_RESULT: ${{ steps.execution.outcome }}
          VERIFICATION_RESULT: ${{ steps.verification.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Release: $RELEASE_TAG
          Application commit: $COMMIT
          Deployment workflow commit: $GITHUB_WORKFLOW_SHA
          Image: $IMAGE_REF
          Publisher: $PUBLISHER_IMAGE_REF
          Worker: $WORKER_IMAGE_REF
          Namespace: $OPENSHIFT_NAMESPACE
          Migration Job: $MIGRATION_JOB

          | Migration | Execution rollout | API rollout | Public checks | Execution verification | Overall |
          | --- | --- | --- | --- | --- | --- |
          | $MIGRATION_RESULT | $EXECUTION_RESULT | $ROLLOUT_RESULT | $SMOKE_RESULT | $VERIFICATION_RESULT | $JOB_RESULT |
          EOF
          if [[ "$EXECUTION_AVAILABLE" != true ]]; then
            echo 'Legacy record: execution not deployed or verified.' >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RUNNER_TEMP/eosc-kubeconfig" "$RUNNER_TEMP/eosc-ca.pem"
